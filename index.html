<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#111111">

  <meta name="description"
        content="Chô Chaï Tarbes - Thaï Street Food">

  <title>Chô Chaï Tarbes | Thaï Street Food</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #333333 0%,
          #151515 40%,
          #080808 100%
        );

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }


    /* =========================
       CARTE
    ========================= */

    .card {

      width: 100%;
      max-width: 430px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.09),
          rgba(255,255,255,0.025)
        );

      border:
        1px solid
        rgba(255,255,255,0.12);

      border-radius: 28px;

      padding:
        32px 22px
        25px;

      text-align: center;

      box-shadow:
        0 30px 80px
        rgba(0,0,0,0.55);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);
    }


    /* =========================
       LOGO
    ========================= */

    .logo {

      width: 115px;
      height: 115px;

      object-fit: contain;

      border-radius: 50%;

      background: white;

      padding: 7px;

      margin-bottom: 18px;
    }


    /* =========================
       TITRE
    ========================= */

    h1 {

      font-size: 26px;

      font-weight: 750;

      margin-bottom: 7px;
    }


    .subtitle {

      font-size: 14px;

      color: #bbbbbb;

      margin-bottom: 25px;
    }


    /* =========================
       BOUTON PRINCIPAL
    ========================= */

    .main-button {

      display: flex;

      align-items: center;

      justify-content: center;

      width: 100%;

      padding: 16px;

      margin-bottom: 12px;

      border-radius: 15px;

      background: white;

      color: #111;

      text-decoration: none;

      font-size: 15px;

      font-weight: 700;

      transition: 0.2s;
    }


    .main-button:hover {

      transform:
        translateY(-2px);

      background:
        #eeeeee;
    }


    /* =========================
       GRILLE
    ========================= */

    .links {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;

      margin-top: 10px;
    }


    .link {

      min-height: 85px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 7px;

      padding: 12px 8px;

      background:
        rgba(255,255,255,0.065);

      border:
        1px solid
        rgba(255,255,255,0.10);

      border-radius: 15px;

      color: white;

      text-decoration: none;

      font-size: 13px;

      transition:
        0.2s ease;
    }


    .link:hover {

      background:
        rgba(255,255,255,0.13);

      transform:
        translateY(-2px);
    }


    .icon {

      font-size: 23px;
    }


    /* =========================
       INFORMATIONS
    ========================= */

    .info {

      margin-top: 20px;

      padding-top: 18px;

      border-top:
        1px solid
        rgba(255,255,255,0.08);
    }


    .phone {

      font-size: 14px;

      color: #cccccc;

      margin-bottom: 9px;
    }


    .address {

      font-size: 12px;

      line-height: 1.5;

      color: #888888;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {

      margin-top: 24px;

      color: #555555;

      font-size: 9px;

      letter-spacing: 1.5px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media(max-width: 400px) {

      body {
        padding: 12px;
      }

      .card {

        padding:
          27px
          16px
          22px;
      }

      h1 {

        font-size: 23px;
      }

    }

  </style>

</head>


<body>


<div class="card">


  <!-- =========================
       LOGO
       Le fichier doit s'appeler logo.png
  ========================== -->

  <img
    src="logo.png"
    alt="Logo Chô Chaï Tarbes"
    class="logo"
  >



  <!-- =========================
       RESTAURANT
  ========================== -->

  <h1>
    Chô Chaï Tarbes
  </h1>


  <div class="subtitle">

    Thaï Street Food 🇹🇭

  </div>



  <!-- =========================
       AJOUT CONTACT
  ========================== -->

  <a
    href="cho-chai-tarbes.vcf"
    class="main-button"
  >

    ＋ Ajouter aux contacts

  </a>



  <!-- =========================
       BOUTONS
  ========================== -->

  <div class="links">


    <!-- APPELER -->

    <a
      href="tel:+335XXXXXXXX"
      class="link"
    >

      <span class="icon">
        📞
      </span>

      Appeler

    </a>



    <!-- GOOGLE MAPS -->

    <a
      href="https://www.google.com/maps/search/?api=1&query_place_id=ChIJScKvTTDTqRIRjHCvj-X__XU"
      target="_blank"
      rel="noopener noreferrer"
      class="link"
    >

      <span class="icon">
        📍
      </span>

      Itinéraire

    </a>



    <!-- MENU -->

    <a
      href="./menu.pdf"
      target="_blank"
      rel="noopener noreferrer"
      class="link"
    >

      <span class="icon">
        🍜
      </span>

      Voir le menu

    </a>



    <!-- SITE WEB -->

    <a
      href="https://www.cho-chai.fr/"
      target="_blank"
      rel="noopener noreferrer"
      class="link"
    >

      <span class="icon">
        🌐
      </span>

      Site web

    </a>



    <!-- INSTAGRAM -->

    <a
      href="https://www.instagram.com/chochai.fr/"
      target="_blank"
      rel="noopener noreferrer"
      class="link"
    >

      <span class="icon">
        📸
      </span>

      Instagram

    </a>



    <!-- UBER EATS -->

    <a
      href="https://www.ubereats.com/fr/store/cho-chai-tarbes/etlB1WAEXWiG_dYNfLWa-A"
      target="_blank"
      rel="noopener noreferrer"
      class="link"
    >

      <span class="icon">
        🛵
      </span>

      Commander

    </a>


  </div>



  <!-- =========================
       INFORMATIONS
  ========================== -->

  <div class="info">

    <!--
      IMPORTANT :
      Remplace le numéro ci-dessous
      par le numéro exact du restaurant.
    -->

    <div class="phone">

      Chô Chaï Tarbes

    </div>


    <div class="address">

      Tarbes, France

    </div>

  </div>



  <footer>

    CHÔ CHAÏ • THAÏ STREET FOOD

  </footer>


</div>


</body>

</html>
